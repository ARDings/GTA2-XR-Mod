; Canonical configuration consumed by gta2ceiling.dll.
; Quest/WinlatorXR validation is required before claiming device compatibility.
[renderer]
mode=takeover
backend=3dfx.dll
own_window=0
render_width=3072
render_height=1536
use_game_tiles=1
fps_cap=30
intro=0
dump_textures=0

[graphics]
; GTA2Ceiling always renders at 100 % of the window without MSAA (the GPU
; budget goes to a steady frame rate); these two keys are ignored.
msaa_samples=0
render_scale_percent=100
; Trilinear mipmaps calm distant detail; original pixel art remains the source.
smooth_textures=1
; 1=trilinear only; 2/4/8 improve oblique surfaces, limited to device support.
anisotropy=4

[sprites]
; 1 gives cars and people a little body (stacked sprite slab); 0 = flat original.
depth=1

[camera]
pitch_tenths=-900
fov_tenths=400

[ceiling]
enabled=1
distance_millimeters=1600
scale_millionths=120000
; GTA2Ceiling Host: passthrough + gcc_exact_colour_key=1 on the shortcut.
; Legacy WinlatorXR: pink colour-key mode 3, tolerance 10, manual placement only.
mixed_reality=1
; Uses the room-bridge capability when supplied by the separate Quest host.
; Waits for a valid scan. Explicitly set 0 for the legacy manual rectangle.
room_scan=1
width_millimeters=2400
depth_millimeters=2400
; Walk out (circle, hold the right stick 4 s): while the city is frozen the
; game's map outside the disc is flat ground (in memory only, put back after).
; 0 keeps it as it is.
walk_out_flat_outside=1

[xr]
enabled=1
; 0 is a flat SBS diagnostic using MODE2; 1 is the real VR/MR projection.
projection_mode=1
; 0 = render once per game frame (30/s); the GTA2Ceiling host reprojects every
; display frame for the current head pose. 1 = extra pairs on head movement.
pose_refresh=0

; Physical keyboard scan-code bindings for GTA2's original default controls.
; The controller must be exposed to the Wine container as an XInput device.
; Names are US physical key positions, independent of the Windows keyboard layout.
; Use NONE to disable a binding. Changes apply when the game screen initializes.
[controller]
enabled=1
stick_deadzone=7849
trigger_threshold=30
up=UP
down=DOWN
left=LEFT
right=RIGHT
a=ENTER
b=ESC
x=SPACE
; TAB is Special/Horn; weapons are X and Z in the original GTA2 controls.
y=TAB
lb=Z
rb=X
; F6 pauses GTA2; ESC opens the exit/abandon prompt during play.
back=F6
start=ESC
left_thumb=NONE
right_thumb=NONE
; LAlt is an explicit optional binding, not the manual's TAB Special action.
; Modern controls are switched in the headset menu (RT): on foot the left stick
; points where to go, in a car RT accelerates, LT brakes and B fires.
lt=LALT
rt=LCTRL
